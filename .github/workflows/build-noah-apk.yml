# 个人二改：打包安卓 App（只在 Actions 页面手动点「Run workflow」才跑）
# 生成一个 Capacitor 壳，直接打开线上 SullyOS；打好的 APK 发到 Releases 的 android-latest。
# 需要的 Secrets 见 native/noah-apk/README.md。
name: 打包安卓 App

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noah-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ID: com.kythie.sullyos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Capacitor config
        run: |
          cp native/noah-apk/capacitor.config.json capacitor.config.json
          rm -rf dist && mkdir -p dist
          cp native/noah-apk/offline.html dist/index.html

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch native project
        run: |
          set -e
          PKG_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$PKG_DIR"
          cp native/noah-apk/MainActivity.java "$PKG_DIR/MainActivity.java"
          cp native/noah-apk/FloatingLyricPlugin.java "$PKG_DIR/FloatingLyricPlugin.java"
          cp native/noah-apk/AppShellPlugin.java "$PKG_DIR/AppShellPlugin.java"
          # 打包时间戳：写进 App 资源（App 内检查更新用），发布的文件名用同一个
          STAMP=$(date -u +%Y%m%d-%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="noah_build_stamp" translatable="false">%s</string></resources>\n' "$STAMP" > android/app/src/main/res/values/noah_build.xml
          # FileProvider 能指到 App 自己的下载目录（App 内更新装包用）
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <external-files-path name="my_files" path="." />
              <cache-path name="my_cache_images" path="." />
          </paths>
          XML
          sed -i 's/^          //' android/app/src/main/res/xml/file_paths.xml
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 麦克风（通话 / 语音识别）、通知、系统语音识别服务的可见性
          python3 - "$MANIFEST" <<'PY'
          import sys, re
          p = sys.argv[1]; s = open(p, encoding='utf-8').read()
          perms = ['android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS',
                   'android.permission.POST_NOTIFICATIONS', 'android.permission.WAKE_LOCK',
                   'android.permission.VIBRATE', 'android.permission.SYSTEM_ALERT_WINDOW', 'android.permission.REQUEST_INSTALL_PACKAGES']
          add = ''.join(f'    <uses-permission android:name="{x}" />\n' for x in perms if x not in s)
          queries = '' if 'android.speech.RecognitionService' in s else (
              '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n')
          s = s.replace('</manifest>', add + queries + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          echo "---- manifest ----"; cat "$MANIFEST"

      - name: Launcher icon (诺亚)
        run: |
          set -e
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil)
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          res = 'android/app/src/main/res'
          art = Image.open('native/noah-apk/icon-art.png').convert('RGBA')
          full = Image.open('native/noah-apk/icon-adaptive.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          def masked(img, n, circle):
              im = img.resize((n * 4, n * 4), Image.LANCZOS)
              m = Image.new('L', im.size, 0); d = ImageDraw.Draw(m)
              (d.ellipse if circle else (lambda b, fill: d.rounded_rectangle(b, radius=n * 4 // 5, fill=fill)))([0, 0, n * 4 - 1, n * 4 - 1], fill=255)
              out = Image.new('RGBA', im.size, (0, 0, 0, 0)); out.paste(im, (0, 0), m)
              return out.resize((n, n), Image.LANCZOS)
          for dpi, n in sizes.items():
              d = f'{res}/mipmap-{dpi}'; os.makedirs(d, exist_ok=True)
              masked(art, n, False).save(f'{d}/ic_launcher.png')
              masked(art, n, True).save(f'{d}/ic_launcher_round.png')
              full.resize((n * 108 // 48, n * 108 // 48), Image.LANCZOS).save(f'{d}/ic_launcher_foreground.png')
          # 自适应图标：整张不透明图当前景，不加 inset（Capacitor 模板默认会缩一圈）
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(f'{res}/mipmap-anydpi-v26/{name}', 'w').write(xml)
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#F6D5C4</color></resources>\n')
          print('launcher icons written')
          PY
          ls android/app/src/main/res/mipmap-anydpi-v26

      - name: Firebase config (主动消息推送)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 -c "import json;d=json.load(open('android/app/google-services.json'));pk=[c['client_info']['android_client_info']['package_name'] for c in d['client']];print('firebase packages:',pk);assert '$APP_ID' in pk, 'google-services.json 里的包名不是 $APP_ID'"
          else
            echo "::warning::没有配置 GOOGLE_SERVICES_JSON，这个 APK 收不到主动消息推送"
          fi

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::没有配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD。签名不固定的话，以后每次更新都得卸载重装、数据会丢，所以不打包。"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > android/app/noah-release.keystore
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  noah {
                      storeFile file('noah-release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'noah'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.noah
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Publish to Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "SullyOS-noah-$STAMP.apk"
          NOTES="自动打包 $STAMP（${GITHUB_SHA::7}）。用手机浏览器下载后安装；签名固定，可以直接覆盖旧版。"
          if gh release view android-latest >/dev/null 2>&1; then
            for name in $(gh release view android-latest --json assets --jq '.assets[].name'); do gh release delete-asset android-latest "$name" --yes || true; done
            gh release edit android-latest --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create android-latest --title "诺亚手机 App（安卓）" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          fi
          gh release upload android-latest "SullyOS-noah-$STAMP.apk" --clobber
